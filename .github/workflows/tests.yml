# Kneady's tests on every push and pull request, in Blender 4.2 LTS (the
# oldest Kneady supports) and the newest release, on Linux, macOS and
# Windows. They run in the background, so they cover everything but what
# needs a window (tests/probe_*.py), which is run by hand before a release.
#
# Greg, 23 November 2026, after the Linux-only runs: "Can we run tests now via
# github? Seems like that would be very informative". The other two systems
# are where file paths, case-sensitive names and the Windows-only code (the
# Recycle Bin, OBS's file check) take a different road. While the repository
# is private a macOS minute counts as about ten of the included minutes; once
# it is public, GitHub's standard runners are free.
#
# Two things they do without, on purpose:
# - The tutorial clips, kept in Git LFS. The tests check that each clip is
#   there, never what is in it (run once with every clip replaced by its LFS
#   pointer: all pass), so the checkout skips LFS and spends none of the
#   repository's LFS bandwidth.
# - The test characters (Rain, MPFB2, Mixamo, Auto-Rig Pro), which can't be
#   published here. Each test that needs one says SKIP and passes.
#
# To test another Blender, add its version to the matrix: the newest patch of
# it is found on download.blender.org and kept in the cache.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} Blender ${{ matrix.blender }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one system failing never stops the others: each is its own answer
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        blender: ["4.2", "5.3"]
    defaults:
      run:
        # Git Bash on Windows, so every step is written once
        shell: bash
    env:
      # the Mesa release Windows draws with, and its processor driver
      MESA: "26.3.1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out Kneady (without the clips in LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          # the tests import the add-on by its folder's name
          path: Kneady

      - name: Find the newest Blender ${{ matrix.blender }}
        id: blender
        run: |
          # each system's download, and where Blender's program sits inside it
          case "$RUNNER_OS" in
            Linux)   kind="linux-x64";   ext="tar.xz"; exe="blender" ;;
            macOS)   kind="macos-arm64"; ext="dmg";    exe="Blender.app/Contents/MacOS/Blender" ;;
            Windows) kind="windows-x64"; ext="zip";    exe="blender.exe" ;;
          esac
          v="${{ matrix.blender }}"
          escaped="${v//./\\.}"
          patch=$(curl -fsSL "https://download.blender.org/release/Blender$v/" \
            | grep -oE "blender-$escaped\.[0-9]+-$kind\.${ext//./\\.}" \
            | sed -E "s/blender-$escaped\.([0-9]+)-.*/\1/" | sort -n | tail -1)
          if [ -z "$patch" ]; then echo "No $kind download for Blender $v"; exit 1; fi
          name="blender-$v.$patch-$kind"
          # what is kept between runs: Blender, and on Windows the Mesa beside it
          key="$name"; [ "$RUNNER_OS" = Windows ] && key="$name-mesa-$MESA"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file=$name.$ext" >> "$GITHUB_OUTPUT"
          echo "url=https://download.blender.org/release/Blender$v/$name.$ext" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Keep Blender between runs
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: ${{ steps.blender.outputs.key }}

      - name: Download Blender
        run: |
          if [ ! -e ~/blender/"${{ steps.blender.outputs.exe }}" ]; then
            mkdir -p ~/blender ~/download
            file=~/download/"${{ steps.blender.outputs.file }}"
            curl -fsSL -o "$file" "${{ steps.blender.outputs.url }}"
            case "$RUNNER_OS" in
              Linux)
                tar -xJf "$file" -C ~/blender --strip-components=1 ;;
              macOS)
                # a disk image: mount it, copy the app out, let it go
                hdiutil attach -nobrowse -readonly -mountpoint ~/download/dmg "$file"
                cp -R ~/download/dmg/Blender.app ~/blender/
                hdiutil detach ~/download/dmg ;;
              Windows)
                # 7-Zip comes with GitHub's Windows machines; it is a Windows
                # program, so it is handed Windows paths (cygpath -w)
                7z x -y -o"$(cygpath -w ~/download/zip)" "$(cygpath -w "$file")" > /dev/null
                mv ~/download/zip/blender-*/* ~/blender/ ;;
            esac
          fi

      # The tutorial tests show a clip's frames, and a frame is drawn by the
      # graphics card. GitHub's Windows machines have none Blender can use:
      # the first run (23 November 2026) crashed both Windows jobs at the
      # first clip (EXCEPTION_ACCESS_VIOLATION, after "Unable to initialize
      # a Vulkan 1.1 instance"). Linux has Mesa, which draws on the
      # processor; Mesa's Windows build (github.com/pal1000/mesa-dist-win),
      # put beside blender.exe, is found before Windows' own OpenGL.
      - name: Give Windows an OpenGL that draws on the processor (Mesa)
        if: runner.os == 'Windows'
        run: |
          if [ ! -e ~/blender/opengl32.dll ]; then
            mkdir -p ~/download
            curl -fsSL -o ~/download/mesa.7z \
              "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA/mesa3d-$MESA-release-msvc.7z"
            7z e -y -o"$(cygpath -w ~/blender)" "$(cygpath -w ~/download/mesa.7z)" \
              x64/opengl32.dll x64/libgallium_wgl.dll > /dev/null
          fi
          ls -l ~/blender/opengl32.dll ~/blender/libgallium_wgl.dll

      - name: Install the libraries Blender loads
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6

      - name: Run the tests
        working-directory: Kneady
        run: ~/blender/"${{ steps.blender.outputs.exe }}" --background --factory-startup --python tests/run.py
